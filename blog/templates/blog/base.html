{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Jimin.blog</title>
    <link rel="stylesheet" href="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="//maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap-theme.min.css">
    <link rel="stylesheet" href="{% static 'css/blog.css' %}">
</head>
<body>
    <div class="site-header">
        <div class="header-inner">
            <a class="site-title" href="/">Jimin.blog</a>
            <div class="header-actions">
                <a class="search-button" href="{% url 'post_search' %}" aria-label="검색">
                    <img src="{% static 'icons/search.svg' %}" alt="">
                </a>
            {% if user.is_authenticated %}
                <a href="{% url 'post_new' %}" class="new-post-button" aria-label="새 글 작성">
                    <img src="{% static 'icons/post.svg' %}" alt="">
                </a>
            {% endif %}
            </div>
        </div>
    </div>
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
